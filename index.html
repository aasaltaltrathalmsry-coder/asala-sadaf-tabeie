<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة التحكم - أصالة التراث المصري</title>
  <style>
    :root{
      --primary:#4A1620;
      --primary-2:#6D2230;
      --gold:#C4A76B;
      --gold-soft:#D9BD82;
      --ivory:#F7F1E3;
      --paper:#FBF7EE;
      --text:#2A2320;
      --danger:#8a1e1e;
      --success:#3b7b58;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:"Cairo","sans-serif";
      background:linear-gradient(135deg,#F7F1E3,#FBF7EE);
      color:var(--text);
    }
    .admin-shell{
      min-height:100vh;
      display:grid;place-items:center;
      padding:30px;
    }
    .login-box{
      width:min(420px,100%);
      background:rgba(255,255,255,.72);
      border:1px solid rgba(196,167,107,.22);
      border-radius:22px;
      box-shadow:0 20px 56px rgba(0,0,0,.12);
      padding:26px;
    }
    .login-box h2{
      margin:0 0 18px;
      text-align:center;
      font-size:2rem;
      color:var(--primary);
      font-family:"Amiri","serif";
    }
    .field{
      display:flex;flex-direction:column;gap:8px;margin-bottom:16px;
    }
    .field label{font-weight:700;color:var(--primary)}
    .field input,.field textarea,.field select{
      width:100%;
      min-height:48px;padding:12px 14px;border:1px solid rgba(196,167,107,.34);
      background:rgba(255,255,255,.7);border-radius:12px;outline:none;resize:vertical;
    }
    .btn{
      width:100%;border:none;border-radius:12px;min-height:48px;
      background:var(--primary);color:#fff;font-weight:800;cursor:pointer;
    }
    .admin-panel{
      display:none;
      width:min(1200px,100%);
      background:rgba(255,255,255,.82);
      border:1px solid rgba(196,167,107,.24);
      border-radius:24px;
      overflow:hidden;
      box-shadow:0 22px 60px rgba(0,0,0,.12);
    }
    .admin-panel.active{display:block}
    .admin-header{
      display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px;background:var(--primary);color:#fff;
    }
    .admin-header h1{
      margin:0;font-size:2.2rem;font-family:"Amiri","serif";
    }
    .top-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .top-actions button{
      border:none;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer;
    }
    .logout-btn{background:rgba(255,255,255,.14);color:#fff}
    .admin-body{
      display:grid;grid-template-columns:220px 1fr;min-height:70vh;
    }
    .side{
      background:rgba(247,241,227,.9);
      border-left:1px solid rgba(196,167,107,.18);
      padding:12px 10px;display:flex;flex-direction:column;gap:8px;
    }
    .tab-btn{
      border:none;padding:12px 12px;border-radius:12px;background:transparent;color:var(--text);font-weight:700;text-align:right;cursor:pointer;
    }
    .tab-btn.active{
      background:var(--primary);color:#fff;
    }
    .main{
      padding:18px;overflow:auto;
    }
    .section-box{display:none}
    .section-box.active{display:block}
    .grid{
      display:grid;grid-template-columns:repeat(2,1fr);gap:16px;
    }
    .field.full{grid-column:1/-1}
    .save-btn{
      width:auto;min-width:160px;background:var(--primary);color:#fff;border:none;border-radius:12px;padding:12px 18px;font-weight:800;cursor:pointer;
    }
    table{
      width:100%;border-collapse:collapse;margin-top:12px;background:rgba(255,255,255,.58);
    }
    th,td{
      border:1px solid rgba(196,167,107,.22);
      padding:10px 12px;text-align:right;vertical-align:middle;font-size:.92rem;
    }
    th{background:rgba(196,167,107,.08);color:var(--primary)}
    .mini-thumb{
      width:50px;height:50px;border-radius:10px;object-fit:cover;border:1px solid rgba(196,167,107,.24);
    }
    .actions{
      display:flex;gap:8px;flex-wrap:wrap;
    }
    .small-btn{
      border:none;border-radius:8px;padding:8px 10px;font-weight:700;cursor:pointer;
    }
    .edit-btn{background:rgba(196,167,107,.18);color:var(--primary)}
    .delete-btn{background:rgba(138,30,30,.08);color:var(--danger)}
    .info-box{
      background:rgba(196,167,107,.12);border:1px solid rgba(196,167,107,.24);
      border-radius:12px;padding:12px 14px;margin-top:12px;color:var(--text);
    }
    .upload-box{
      border:1px dashed rgba(196,167,107,.5);border-radius:14px;padding:16px;background:rgba(255,255,255,.5);display:flex;flex-direction:column;gap:12px;
    }
    .preview-frame{
      width:100%;
      min-height:420px;
      border:1px solid rgba(196,167,107,.22);
      border-radius:16px;
      background:#fff;
    }

    @media (max-width:760px){
      .admin-body{grid-template-columns:1fr}
      .side{flex-direction:row;overflow:auto;border-left:none;border-bottom:1px solid rgba(196,167,107,.18)}
      .grid{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <div class="admin-shell">
    <div id="loginBox" class="login-box">
      <h2>لوحة التحكم</h2>
      <div class="field">
        <label>كلمة المرور</label>
        <input id="passwordInput" type="password" placeholder="أدخل كلمة المرور" />
      </div>
      <button class="btn" id="loginBtn">دخول</button>
    </div>

    <div id="adminPanel" class="admin-panel">
      <div class="admin-header">
        <h1>أصالة التراث المصري</h1>
        <div class="top-actions">
          <button class="logout-btn" id="logoutBtn">تسجيل الخروج</button>
        </div>
      </div>

      <div class="admin-body">
        <div class="side" id="sideTabs">
          <button class="tab-btn active" data-tab="general">عام</button>
          <button class="tab-btn" data-tab="products">المنتجات</button>
          <button class="tab-btn" data-tab="design">التصميم</button>
          <button class="tab-btn" data-tab="media">الوسائط</button>
          <button class="tab-btn" data-tab="shipping">الشحن</button>
          <button class="tab-btn" data-tab="backup">نسخ احتياطي</button>
          <button class="tab-btn" data-tab="preview">معاينة حية</button>
        </div>

        <div class="main">
          <div class="section-box active" id="generalBox">
            <h3>الإعدادات العامة</h3>
            <div class="grid">
              <div class="field"><label>اسم المتجر</label><input id="shopNameInput" type="text" /></div>
              <div class="field"><label>السلوغان</label><input id="sloganInput" type="text" /></div>
              <div class="field full"><label>الوصف</label><textarea id="descriptionInput" rows="3"></textarea></div>
              <div class="field"><label>واتساب</label><input id="whatsappInput" type="text" /></div>
              <div class="field"><label>بريد إلكتروني</label><input id="emailInput" type="text" /></div>
              <div class="field"><label>إنستغرام</label><input id="instaInput" type="text" /></div>
              <div class="field"><label>فيسبوك</label><input id="fbInput" type="text" /></div>
              <div class="field full"><label>نص شريط الثقة</label><input id="announcementInput" type="text" /></div>
              <div class="field"><label>عنوان الغلاف</label><input id="heroTitleInput" type="text" /></div>
              <div class="field"><label>سطر العنوان</label><input id="heroEyebrowInput" type="text" /></div>
              <div class="field full"><label>وصف الغلاف</label><textarea id="heroTextInput" rows="3"></textarea></div>
            </div>
            <div style="margin-top:16px;">
              <button id="saveGeneralBtn" class="save-btn">حفظ</button>
            </div>
          </div>

          <div class="section-box" id="productsBox">
            <h3>إدارة المنتجات</h3>

            <div class="grid">
              <div class="field"><label>اسم المنتج</label><input id="pName" type="text" /></div>
              <div class="field"><label>التصنيف</label>
                <select id="pCategory">
                  <option>مجالس</option>
                  <option>صناديق</option>
                  <option>حوامل مصحف</option>
                  <option>طاولات</option>
                  <option>كراسي</option>
                  <option>أثاث مكتبي</option>
                  <option>مباخر</option>
                  <option>صواني تقديم</option>
                  <option>أخرى</option>
                </select>
              </div>
              <div class="field"><label>السعر الحالي (د.ك)</label><input id="pPrice" type="number" /></div>
              <div class="field"><label>السعر القديم (د.ك)</label><input id="pOldPrice" type="number" /></div>
              <div class="field full"><label>الوصف</label><textarea id="pDesc" rows="3"></textarea></div>
              <div class="field full"><label>رابط الصورة</label><input id="pImage" type="text" placeholder="رابط صورة HTTPS أو base64" /></div>
            </div>

            <div style="margin-top:16px; display:flex; gap:10px; flex-wrap:wrap;">
              <button id="saveProductBtn" class="save-btn">حفظ المنتج</button>
              <button id="resetProductFormBtn" class="save-btn" style="background:#6D2230">مسح النموذج</button>
            </div>

            <table>
              <thead>
                <tr>
                  <th>الصورة</th>
                  <th>الاسم</th>
                  <th>السعر</th>
                  <th>الفئة</th>
                  <th>إجراءات</th>
                </tr>
              </thead>
              <tbody id="productsTableBody"></tbody>
            </table>
          </div>

          <div class="section-box" id="designBox">
            <h3>التصميم</h3>
            <div class="grid">
              <div class="field"><label>اللون الأساسي</label><input id="colorPrimary" type="color" value="#4A1620" /></div>
              <div class="field"><label>اللون الذهبي</label><input id="colorGold" type="color" value="#C4A76B" /></div>
              <div class="field"><label>لون الخلفية</label><input id="colorPaper" type="color" value="#FBF7EE" /></div>
              <div class="field"><label>لون النص</label><input id="colorText" type="color" value="#2A2320" /></div>
              <div class="field"><label>خط العناوين</label><select id="titleFont"><option value="Amiri">Amiri</option><option value="Cairo">Cairo</option></select></div>
              <div class="field"><label>خط النصوص</label><select id="bodyFont"><option value="Cairo">Cairo</option><option value="Noto Kufi Arabic">Noto Kufi Arabic</option></select></div>
            </div>
            <div style="margin-top:16px;"><button id="saveDesignBtn" class="save-btn">حفظ التصميم</button></div>
          </div>

          <div class="section-box" id="mediaBox">
            <h3>الوسائط</h3>
            <div class="grid">
              <div class="field full">
                <label>لوجو المتجر</label>
                <div class="upload-box">
                  <input type="file" id="logoUpload" accept="image/*" />
                  <input id="logoInput" type="text" placeholder="رابط الصورة أو base64" />
                </div>
              </div>

              <div class="field full">
                <label>صورة الغلاف</label>
                <div class="upload-box">
                  <input type="file" id="heroUpload" accept="image/*" />
                  <input id="heroImageInput" type="text" placeholder="رابط صورة الغلاف أو base64" />
                </div>
              </div>

              <div class="field full">
                <label>فيديو الغلاف</label>
                <div class="upload-box">
                  <input type="file" id="videoUpload" accept="video/*" />
                  <input id="videoInput" type="text" placeholder="رابط فيديو MP4 أو URL" />
                </div>
              </div>

              <div class="field full">
                <label>صورة حكاية الصنعة</label>
                <div class="upload-box">
                  <input type="file" id="storyUpload" accept="image/*" />
                  <input id="storyImageInput" type="text" placeholder="رابط صورة حكاية الصنعة أو base64" />
                </div>
              </div>
            </div>
            <div style="margin-top:16px;"><button id="saveMediaBtn" class="save-btn">حفظ الوسائط</button></div>
          </div>

          <div class="section-box" id="shippingBox">
            <h3>خيارات الشحن</h3>
            <div class="grid">
              <div class="field full"><label>داخل الكويت</label><input id="ship1" type="text" value="توصيل سريع 2-4 أيام" /></div>
              <div class="field full"><label>دول الخليج</label><input id="ship2" type="text" value="10-15 يوم • حسب الوجهة" /></div>
              <div class="field full"><label>شحن عالمي</label><input id="ship3" type="text" value="شحن جوي وبحري • تغليف خشبي ملكي" /></div>
              <div class="field full"><label>استلام من الفرع</label><input id="ship4" type="text" value="استلام من الفرع • متاح" /></div>
            </div>
            <div style="margin-top:16px;"><button id="saveShippingBtn" class="save-btn">حفظ الشحن</button></div>
          </div>

          <div class="section-box" id="backupBox">
            <h3>النسخ الاحتياطي</h3>
            <div class="grid">
              <div class="field">
                <label>تصدير JSON</label>
                <button id="exportBtn" class="save-btn">تحميل نسخة احتياطية</button>
              </div>
              <div class="field">
                <label>استيراد JSON</label>
                <input id="importInput" type="file" accept="application/json" />
              </div>
            </div>
          </div>

          <div class="section-box" id="previewBox">
            <h3>المعاينة الحية</h3>
            <iframe id="livePreviewFrame" class="preview-frame" title="معاينة حية"></iframe>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "asala_store_v1";
    const ADMIN_PASSWORD = "asala2026";

    function readStore(){
      try{
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : {
          settings: {
            shopName: "أصالة التراث المصري",
            slogan: "فن يدوي أصيل",
            description: "صدف طبيعي • خشب زان • أعمال فاخرة",
            whatsapp: "96551118069",
            email: "asalat.al.torath.Kw.Eg@GMAIL.COM",
            instagram: "asalat.al.torath.kw.eg",
            facebook: "profile.php?id=61595434109686",
            announcement: "🚚 توصيل من الكويت إلى الخليج والعالم — تفصيل 15-20 يومًا — أصالة مدى الحياة ♾️",
            heroTitle: "قطعة من مصر، وحكاية في بيتك",
            heroSubtitle: "تراث يُحكى… وفن يُقتنى",
            heroText: "حين يلتقي عبق الأصالة بفن الصدف البحري، يولد مجسم يروي حكاية فخامة.",
            heroImage: "https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?auto=format&fit=crop&w=1400&q=80",
            storyImage: "https://images.unsplash.com/photo-1517705008128-361805f42e86?auto=format&fit=crop&w=1200&q=80",
            logo: ""
          },
          products: [
            { id:1, name:"مجلس عربي فاخر - التراث الكلاسيكي", category:"مجالس", price:14500, oldPrice:18000, description:"مجلس عربي فاخر من خشب الزان الطبيعي.", image:"https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?auto=format&fit=crop&w=900&q=80" }
          ],
          media: {
            logo: "",
            heroImage: "https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?auto=format&fit=crop&w=1400&q=80",
            video: "",
            storyImage: "https://images.unsplash.com/photo-1517705008128-361805f42e86?auto=format&fit=crop&w=1200&q=80"
          },
          shipping: [
            "داخل الكويت • توصيل سريع 2-4 أيام",
            "دول الخليج • 10-15 يوم • حسب الوجهة",
            "شحن عالمي • شحن جوي وبحري",
            "استلام من الفرع • متاح"
          ],
          design: {
            primary:"#4A1620",
            gold:"#C4A76B",
            paper:"#FBF7EE",
            text:"#2A2320",
            titleFont:"Amiri",
            bodyFont:"Cairo"
          }
        };
      }catch{
        return {};
      }
    }

    function saveStore(data){
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    function getStore(){
      return readStore();
    }

    function readAdminCurrent(){
      const data = getStore();
      return {
        settings: data.settings || {},
        products: data.products || [],
        media: data.media || {},
        shipping: data.shipping || [],
        design: data.design || {}
      };
    }

    function renderAdmin(){
      const data = readAdminCurrent();

      document.getElementById("shopNameInput").value = data.settings.shopName || "";
      document.getElementById("sloganInput").value = data.settings.slogan || "";
      document.getElementById("descriptionInput").value = data.settings.description || "";
      document.getElementById("whatsappInput").value = data.settings.whatsapp || "";
      document.getElementById("emailInput").value = data.settings.email || "";
      document.getElementById("instaInput").value = data.settings.instagram || "";
      document.getElementById("fbInput").value = data.settings.facebook || "";
      document.getElementById("announcementInput").value = data.settings.announcement || "";
      document.getElementById("heroTitleInput").value = data.settings.heroTitle || "";
      document.getElementById("heroEyebrowInput").value = data.settings.heroSubtitle || "";
      document.getElementById("heroTextInput").value = data.settings.heroText || "";

      document.getElementById("logoInput").value = data.media.logo || "";
      document.getElementById("heroImageInput").value = data.media.heroImage || "";
      document.getElementById("videoInput").value = data.media.video || "";
      document.getElementById("storyImageInput").value = data.media.storyImage || "";

      document.getElementById("ship1").value = data.shipping[0] || "";
      document.getElementById("ship2").value = data.shipping[1] || "";
      document.getElementById("ship3").value = data.shipping[2] || "";
      document.getElementById("ship4").value = data.shipping[3] || "";

      document.getElementById("colorPrimary").value = data.design.primary || "#4A1620";
      document.getElementById("colorGold").value = data.design.gold || "#C4A76B";
      document.getElementById("colorPaper").value = data.design.paper || "#FBF7EE";
      document.getElementById("colorText").value = data.design.text || "#2A2320";
      document.getElementById("titleFont").value = data.design.titleFont || "Amiri";
      document.getElementById("bodyFont").value = data.design.bodyFont || "Cairo";

      renderProductsTable();
      renderPreview();
    }

    function renderProductsTable(){
      const data = readAdminCurrent();
      const tbody = document.getElementById("productsTableBody");
      tbody.innerHTML = data.products.map(product => `
        <tr>
          <td><img class="mini-thumb" src="${product.image || 'https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?auto=format&fit=crop&w=200&q=80'}" alt="${product.name}" /></td>
          <td>${product.name}</td>
          <td>${Number(product.price || 0).toLocaleString("ar-KW", {minimumFractionDigits:3, maximumFractionDigits:3})} د.ك</td>
          <td>${product.category}</td>
          <td>
            <div class="actions">
              <button class="small-btn edit-btn" data-edit-id="${product.id}">تعديل</button>
              <button class="small-btn delete-btn" data-delete-id="${product.id}">حذف</button>
            </div>
          </td>
        </tr>
      `).join("");

      document.querySelectorAll("[data-edit-id]").forEach(btn => {
        btn.onclick = () => {
          const id = Number(btn.dataset.editId);
          const product = getStore().products.find(p => p.id === id);
          if (!product) return;
          document.getElementById("pName").value = product.name;
          document.getElementById("pCategory").value = product.category || "مجالس";
          document.getElementById("pPrice").value = product.price || "";
          document.getElementById("pOldPrice").value = product.oldPrice || "";
          document.getElementById("pDesc").value = product.description || "";
          document.getElementById("pImage").value = product.image || "";
          document.body.dataset.editProductId = String(id);
        };
      });

      document.querySelectorAll("[data-delete-id]").forEach(btn => {
        btn.onclick = () => {
          const id = Number(btn.dataset.deleteId);
          const store = getStore();
          store.products = store.products.filter(p => p.id !== id);
          saveStore(store);
          renderAdmin();
        };
      });
    }

    function renderPreview(){
      const data = getStore();
      const html = `
        <!doctype html>
        <html lang="ar" dir="rtl">
        <head>
          <meta charset="UTF-8" />
          <style>
            body{margin:0;font-family:'Cairo',sans-serif;background:${data.design?.paper || '#FBF7EE'};color:${data.design?.text || '#2A2320'};}
            .hero{position:relative;min-height:360px;display:flex;align-items:flex-end;padding:30px;background:#111;}
            .hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.45)}
            .container{width:min(1100px,calc(100% - 22px));margin:0 auto;position:relative;z-index:1}
            h1{font-family:${data.design?.titleFont || 'Amiri'},serif;color:#fff;font-size:2.6rem;margin:0 0 10px}
            p{color:#fff;line-height:1.8}
            .box{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:18px 0}
            .card{background:#fff;border-radius:12px;padding:12px;border:1px solid rgba(0,0,0,.08)}
            .btn{display:inline-block;padding:10px 14px;border-radius:10px;background:${data.design?.gold || '#C4A76B'};color:${data.design?.text || '#2A2320'};font-weight:800}
          </style>
        </head>
        <body>
          <div class="hero">
            <img src="${data.media?.heroImage || data.settings?.heroImage || 'https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?auto=format&fit=crop&w=1200&q=80'}">
            <div class="container">
              <h1>${data.settings?.heroTitle || 'أصالة التراث المصري'}</h1>
              <p>${data.settings?.heroText || 'مشغولات فاخرة من الصدف الطبيعي والخشب.'}</p>
              <div class="btn">تسوّق المجموعة</div>
            </div>
          </div>
          <div class="container">
            <div class="box">
              ${(data.products || []).slice(0,3).map(p => `<div class="card"><h3>${p.name}</h3><p>${p.description}</p></div>`).join("")}
            </div>
          </div>
        </body>
        </html>
      `;
      document.getElementById("livePreviewFrame").srcdoc = html;
    }

    function resetProductForm(){

    function saveProduct(){
      const store = getStore();
      const editId = Number(document.body.dataset.editProductId || 0);

      const item = {
        id: editId || (store.products.length ? Math.max(...store.products.map(p => p.id)) + 1 : 1),
        name: document.getElementById("pName").value.trim(),
        category: document.getElementById("pCategory").value,
        price: Number(document.getElementById("pPrice").value || 0),
        oldPrice: Number(document.getElementById("pOldPrice").value || 0),
        description: document.getElementById("pDesc").value.trim(),
        image: document.getElementById("pImage").value.trim()
      };

      if (!item.name || !item.description || !item.image) {
        alert("املأ اسم المنتج والوصف والصورة.");
        return;
      }

      if (editId) {
        store.products = store.products.map(p => p.id === editId ? {...p, ...item} : p);
      } else {
        store.products.unshift(item);
      }

      saveStore(store);
      renderAdmin();
      resetProductForm();
    }

    function readFileAsDataURL(file){
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }
