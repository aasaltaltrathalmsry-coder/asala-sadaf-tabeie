<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>أصالة التراث المصري</title>
  <meta name="description" content="أصالة التراث المصري - قطع فاخرة من الصدف الطبيعي والخشب الأصيل" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --primary:#4A1620;
      --primary-dark:#6D2230;
      --gold:#C4A76B;
      --gold-light:#D9BD82;
      --ivory:#F7F1E3;
      --paper:#FBF7EE;
      --olive:#3D4A3A;
      --text:#2A2320;

      --font-heading:"Amiri","Times New Roman",serif;
      --font-body:"Cairo","Segoe UI",Tahoma,sans-serif;

      --radius:18px;
      --shadow-soft:0 10px 24px rgba(42,35,32,.12);
      --shadow-strong:0 14px 28px rgba(42,35,32,.15);
      --header-h:80px;
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      direction:rtl;
      text-align:right;
      font-family:var(--font-body);
      background:var(--paper);
      color:var(--text);
      line-height:1.8;
    }
    a{text-decoration:none;color:inherit}
    img{display:block;max-width:100%}
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    .container{width:min(1200px,calc(100% - 30px));margin:0 auto}
    .section{padding:80px 0}
    .section-header{margin-bottom:28px}
    .section-title{
      margin:0 0 10px;
      font-family:var(--font-heading);
      font-size:clamp(2.2rem, 3vw, 3.2rem);
      color:var(--primary);
      line-height:1.1;
      font-weight:700;
    }
    .section-subtitle{
      margin:0;
      color:rgba(42,35,32,.75);
      font-size:1.05rem;
    }
    .primary-btn,.ghost-btn,.small-btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      border:none;
      border-radius:12px;
      font-weight:700;
      padding:14px 22px;
      transition:.25s ease;
      cursor:pointer;
    }
    .primary-btn{
      background:var(--gold);
      color:var(--text);
      box-shadow:0 10px 22px rgba(196,167,107,.28);
    }
    .primary-btn:hover{filter:brightness(.98)}
    .ghost-btn{
      background:transparent;
      color:var(--paper);
      border:1px solid rgba(212,183,110,.9);
      padding:14px 20px;
    }
    .ghost-btn:hover{background:rgba(255,255,255,.05)}
    .small-btn{
      background:var(--primary);
      color:var(--paper);
      padding:10px 16px;
      font-size:.9rem;
    }

    /* announcement */
    .announcement-bar{
      background:var(--primary);
      color:var(--ivory);
      border-bottom:1px solid rgba(255,255,255,.08);
    }
    .announcement-inner{
      width:min(1200px,calc(100% - 30px));
      min-height:46px;
      margin:0 auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      font-size:.92rem;
      font-weight:600;
    }
    .announcement-link{
      color:var(--gold-light);
      flex-shrink:0;
      font-weight:700;
    }
    .announcement-message{
      flex:1;
      text-align:center;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    /* header */
    .site-header{
      position:sticky;
      top:0;
      z-index:50;
      background:rgba(251,247,238,.82);
      backdrop-filter:blur(10px);
      border-bottom:1px solid rgba(196,167,107,.25);
    }
    .header-inner{
      display:flex;
      align-items:center;
      justify-content:space-between;
      height:var(--header-h);
      gap:18px;
    }
    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      min-width:220px;
    }
    .brand-mark{
      width:42px;height:42px;border-radius:50%;
      display:grid;place-items:center;
      background:linear-gradient(135deg,var(--gold),var(--gold-light));
      color:var(--primary);
      font-size:1.3rem;
      font-weight:700;
      box-shadow:0 10px 22px rgba(196,167,107,.3);
    }
    .brand-text{
      font-family:var(--font-heading);
      font-size:1.5rem;
      line-height:1.1;
      color:var(--primary);
      font-weight:700;
    }
    .main-nav{
      display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center;
    }
    .main-nav a{
      padding:9px 12px;
      border-radius:10px;
      color:var(--text);
      font-weight:600;
      transition:.25s ease;
    }
    .main-nav a:hover{
      background:rgba(196,167,107,.12);
      color:var(--primary);
    }
    .header-actions{
      display:flex;align-items:center;gap:10px;
    }
    .icon-btn{
      width:42px;height:42px;border-radius:12px;border:1px solid rgba(196,167,107,.4);
      background:rgba(196,167,107,.12); color:var(--primary); display:grid;place-items:center;
      font-size:1.1rem;
    }
    .icon-btn:hover{background:var(--gold);}

    /* Intro overlay */
    .intro-overlay{
      position:fixed;inset:0;z-index:100;
      background:rgba(7,7,7,.86);
      display:grid;place-items:center;
      opacity:1;visibility:visible;transition:.35s ease;
    }
    .intro-overlay.hidden{
      opacity:0;visibility:hidden;pointer-events:none;
    }
    .intro-video{
      position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.35) saturate(.8);
    }
    .intro-content{
      position:relative;z-index:2;text-align:center;color:var(--ivory);
    }
    .intro-logo{
      font-family:var(--font-heading);
      font-size:clamp(2.3rem,5vw,4rem);
      color:var(--gold-light);
      margin-bottom:10px;
    }
    .intro-skip{
      position:absolute;left:30px;bottom:24px;
      background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.2);
      color:var(--ivory);
      padding:10px 16px;border-radius:10px;
      backdrop-filter:blur(6px);
    }

    /* hero */
    .hero{
      position:relative;
      min-height:85vh;
      display:flex;align-items:flex-end;
      overflow:hidden;
      background:#111;
    }
    .hero-bg,.hero-video{
      position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.42) saturate(.85)
    }
    .hero-gradient{
      position:absolute;inset:0;
      background:linear-gradient(90deg, rgba(17,11,9,.82), rgba(17,11,9,.4), rgba(17,11,9,.1));
    }
    .hero-inner{
      position:relative;z-index:2;
      width:min(1200px,calc(100% - 30px));
      margin:0 auto;
      padding:80px 0 70px;
      display:flex;align-items:flex-end;justify-content:space-between;gap:28px;
    }
    .hero-copy{
      max-width:680px;
      color:var(--ivory);
    }
    .eyebrow{
      font-size:1.02rem;
      letter-spacing:.05em;
      color:var(--gold-light);
      margin-bottom:18px;
      font-weight:700;
    }
    .hero-copy h1{
      margin:0 0 18px;
      color:var(--ivory);
      font-family:var(--font-heading);
      font-size:clamp(2.8rem,4vw,3.7rem);
      line-height:1.08;
      font-weight:700;
    }
    .hero-copy p{
      font-size:1.08rem;
      color:rgba(247,241,227,.9);
      margin:0 0 24px;
      line-height:1.9;
      max-width:620px;
    }
    .hero-actions{
      display:flex;align-items:center;flex-wrap:wrap;gap:14px;margin-bottom:16px;
    }
    .hero-card{
      min-width:280px;max-width:320px;
      padding:18px 18px 22px;
      border-radius:18px;
      background:rgba(251,247,238,.09);
      border:1px solid rgba(196,167,107,.42);
      backdrop-filter:blur(8px);
      box-shadow:var(--shadow-soft);
      color:var(--ivory);
    }
    .hero-card .badge{
      display:inline-block;
      border-radius:999px;
      background:rgba(196,167,107,.14);
      color:var(--gold-light);
      padding:8px 12px;
      font-size:.8rem;
      font-weight:700;
      margin-bottom:12px;
    }
    .hero-card h3{
      margin:0 0 12px;
      font-family:var(--font-heading);
      font-size:2rem; color:var(--ivory);
    }
    .hero-card .mini{
      font-size:.95rem;color:rgba(247,241,227,.88);line-height:1.8;
    }
    .hero-note{
      font-size:.9rem;color:rgba(247,241,227,.82);
    }

    /* trust */
    .trust{
      background:var(--ivory);
      border-top:1px solid rgba(196,167,107,.2);
      border-bottom:1px solid rgba(196,167,107,.2);
    }
    .trust-grid{
      display:grid;grid-template-columns:repeat(4,1fr);gap:18px;
      padding:26px 0;
    }
    .trust-item{
      display:flex;align-items:center;gap:13px;
      background: rgba(255,255,255,.32);
      border:1px solid rgba(196,167,107,.2);
      border-radius:12px;
      padding:18px 14px;
      min-height:96px;
    }
    .trust-icon{
      width:42px;height:42px;border-radius:12px;
      background:rgba(196,167,107,.14);
      display:grid;place-items:center;
      font-size:1.45rem;
      color:var(--primary);
      flex-shrink:0;
    }
    .trust-item strong{
      display:block;
      font-size:1rem;color:var(--primary);margin-bottom:3px;
    }
    .trust-item span{
      display:block;
      color:rgba(42,35,32,.75);
      font-size:.84rem;
      line-height:1.7;
    }

    /* collection */
    .chip-row{
      display:flex;flex-wrap:wrap;gap:10px;margin:20px 0 24px;
    }
    .chip{
      border:1px solid rgba(196,167,107,.45);
      background:rgba(255,255,255,.5);
      color:var(--primary);
      padding:9px 14px;
      border-radius:999px;
      font-weight:700;
      transition:.2s ease;
    }
    .chip.active{
      background:var(--primary);
      color:var(--ivory);
      border-color:var(--primary);
    }
    .toolbar{
      display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    }
    .search-input,.select-input{
      border:1px solid rgba(196,167,107,.36);
      background:rgba(255,255,255,.68);
      border-radius:12px;
      min-height:48px;
      padding:12px 14px;
      color:var(--text);
      outline:none;
    }
    .search-input{min-width:260px}
    .select-input{min-width:200px}
    .products-grid{
      display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:28px;
    }
    .product-card{
      background:rgba(255,255,255,.72);
      border:1px solid rgba(196,167,107,.22);
      border-radius:18px;
      overflow:hidden;
      box-shadow:var(--shadow-soft);
      transition:.25s ease;
    }
    .product-card:hover{
      transform:translateY(-4px);
      box-shadow:var(--shadow-strong);
      border-color:rgba(196,167,107,.8);
    }
    .product-media{
      position:relative;height:310px;background:var(--ivory);overflow:hidden;
      border-bottom:1px solid rgba(196,167,107,.22);
    }
    .product-media img{
      width:100%;height:100%;object-fit:cover;cursor:pointer;
    }
    .product-badges{
      position:absolute;top:12px;right:12px;display:flex;gap:8px;flex-wrap:wrap;
    }
    .badge{
      padding:7px 10px;border-radius:999px;font-size:.72rem;font-weight:800;line-height:1;
    }
    .badge.available{background:rgba(61,74,58,.95);color:#fff}
    .badge.request{background:rgba(196,167,107,.96);color:var(--primary)}
    .badge.edition{background:rgba(74,22,32,.9);color:var(--ivory)}

    .product-body{padding:18px 16px 16px}
    .product-category{
      display:inline-block;
      background:rgba(196,167,107,.12);
      color:var(--primary);
      border:1px solid rgba(196,167,107,.2);
      border-radius:999px;
      padding:6px 10px;
      font-size:.75rem;
      font-weight:800;
    }
    .product-title{
      margin:12px 0 8px;
      font-family:var(--font-heading);
      font-size:1.9rem;
      color:var(--primary);
      line-height:1.15;
    }
    .product-desc{
      min-height:54px;
      margin:0 0 16px;
      color:rgba(42,35,32,.76);
      font-size:.93rem;
      line-height:1.9;
      display:-webkit-box;
      -webkit-line-clamp:2;
      -webkit-box-orient:vertical;
      overflow:hidden;
    }
    .product-price-row{
      display:flex;align-items:flex-end;justify-content:space-between;gap:12px;
      border-top:1px dashed rgba(196,167,107,.5);padding-top:14px;margin-bottom:14px;
    }
    .price-current{
      font-size:1.45rem;font-weight:800;color:var(--primary)
    }
    .price-old{
      color:rgba(42,35,32,.5);font-size:.9rem;text-decoration:line-through
    }
    .product-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .cart-btn,.wa-btn{
      border:none;border-radius:10px;padding:11px 14px;font-weight:800;min-height:42px;flex:1
    }
    .cart-btn{background:var(--primary);color:var(--ivory);min-width:120px}
    .wa-btn{background:var(--gold);color:var(--text)}
    .collection-note{
      text-align:center;
      margin-top:18px;
      color:rgba(42,35,32,.72);
      font-size:.9rem;
    }

    /* story */
    .story-wrap{
      background:linear-gradient(180deg, rgba(196,167,107,.04), rgba(196,167,107,.12));
    }
    .story-grid{
      display:grid;grid-template-columns:1.08fr 1.22fr;gap:28px;align-items:center;
    }
    .story-image{
      border-radius:20px;overflow:hidden;box-shadow:var(--shadow-soft);
      min-height:520px;
      background:#ddd;
    }
    .story-image img{width:100%;height:100%;object-fit:cover}
    .story-copy p{
      margin:0 0 16px;
      color:rgba(42,35,32,.82);
      line-height:2;
      font-size:1rem;
    }
    .signature{
      margin-top:14px;
      font-family:var(--font-heading);
      font-size:1.8rem;
      color:var(--primary-dark);
    }

    /* custom order */
    .custom-order{
      background:linear-gradient(135deg, var(--gold-light), rgba(255,255,255,.3));
      border-top:1px dashed rgba(74,22,32,.45);
      border-bottom:1px dashed rgba(74,22,32,.45);
    }
    .custom-card{
      background:rgba(255,255,255,.2);
      border:2px dashed rgba(74,22,32,.38);
      border-radius:22px;
      padding:34px 26px;
    }
    .custom-card p{
      margin:0 0 18px;
      line-height:2;
      font-size:1.04rem;
      color:rgba(42,35,32,.87);
      max-width:760px;
    }
    .feature-grid{
      display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:20px 0 26px;
    }
    .feature-item{
      display:flex;align-items:center;gap:12px;
      padding:18px 16px;
      border-radius:16px;
      background:rgba(255,255,255,.2);
      border:1px solid rgba(74,22,32,.12);
      color:var(--text);
      font-weight:700;
    }
    .feature-item .emoji{
      font-size:1.8rem;
      width:34px;text-align:center;
    }

    /* shipping */
    .shipping-grid{
      display:grid;grid-template-columns:repeat(3,1fr);gap:22px;
    }
    .shipping-card{
      background:rgba(255,255,255,.72);
      border:1px solid rgba(196,167,107,.22);
      border-radius:18px;
      padding:22px 18px;
      box-shadow:var(--shadow-soft);
    }
    .shipping-card h3{
      margin:0 0 12px;
      font-family:var(--font-heading);
      font-size:1.9rem;color:var(--primary);
    }
    .shipping-card p{
      margin:0 0 8px;
      color:rgba(42,35,32,.8);
      line-height:1.9;
      font-size:.98rem;
    }
    .guarantee{
      margin-top:22px;
      background:rgba(196,167,107,.12);
      border-right:4px solid var(--gold);
      border-radius:12px;
      padding:18px 20px;
      font-weight:700;
      color:var(--text);
    }

    /* testimonials */
    .testimonials-grid{
      display:grid;grid-template-columns:repeat(3,1fr);gap:22px;
    }
    .testimonial{
      background:rgba(255,255,255,.72);
      border:1px solid rgba(196,167,107,.22);
      border-radius:18px;
      padding:22px 18px;
      box-shadow:var(--shadow-soft);
    }
    .testimonial-top{
      display:flex;justify-content:space-between;align-items:center;gap:10px;
    }
    .name-box{font-weight:800;color:var(--primary)}
    .city-box{font-size:.8rem;color:rgba(42,35,32,.7)}
    .stars{color:var(--gold);letter-spacing:1px}
    .testimonial p{
      margin:14px 0 0;
      color:rgba(42,35,32,.8);
      line-height:1.9;
      font-size:.98rem;
    }

    /* footer */
    footer{
      background:var(--primary);
      color:var(--ivory);
      padding:56px 0 18px;
    }
    .footer-grid{
      display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:28px;
    }
    .footer-brand .brand{margin-bottom:12px}
    .footer-brand p{
      color:rgba(247,241,227,.82);
      line-height:1.9;
      margin:0;
    }
    .footer-box h4{
      margin:0 0 12px;
      font-family:var(--font-heading);
      font-size:2rem;
      color:var(--gold-light);
    }
    .footer-links{
      display:flex;flex-direction:column;gap:10px;
      color:rgba(247,241,227,.82);
    }
    .footer-bottom{
      display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;
      padding-top:20px;margin-top:20px;border-top:1px solid rgba(255,255,255,.12);
      color:rgba(247,241,227,.7);font-size:.9rem;
    }

    /* cart drawer */
    .drawer-backdrop{
      position:fixed;inset:0;background:rgba(12,12,12,.3);z-index:60;display:none;
    }
    .drawer-backdrop.open{display:block}
    .cart-drawer{
      position:fixed;top:0;bottom:0;right:0;width:min(420px,92vw);
      background:rgba(251,247,238,.98);
      border-left:1px solid rgba(196,167,107,.3);
      box-shadow:-16px 0 30px rgba(0,0,0,.18);
      transform:translateX(100%);
      transition:.28s ease;
      z-index:61;display:flex;flex-direction:column;
    }
    .cart-drawer.open{transform:translateX(0)}
    .drawer-header{
      display:flex;align-items:center;justify-content:space-between;gap:12px;
      padding:18px 18px 14px;
      border-bottom:1px solid rgba(196,167,107,.26);
    }
    .drawer-title{
      margin:0;
      font-family:var(--font-heading);
      font-size:2rem;
      color:var(--primary);
    }
    .close-btn{
      background:transparent;border:none;color:var(--primary);font-size:2rem;line-height:1;cursor:pointer;
    }
    .drawer-body{
      flex:1;overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:14px;
    }
    .cart-item{
      display:grid;grid-template-columns:86px 1fr auto;gap:12px;align-items:center;
      background:#fff;border:1px solid rgba(196,167,107,.25);border-radius:14px;padding:12px;
    }
    .cart-item img{
      width:86px;height:76px;object-fit:cover;border-radius:10px;
    }
    .cart-item h4{
      margin:0 0 5px;font-size:.96rem;color:var(--primary);line-height:1.5;
    }
    .cart-item small{color:rgba(42,35,32,.7)}
    .qty-row{
      display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;
    }
    .qty-controls{
      display:flex;align-items:center;gap:8px;
    }
    .qty-controls button{
      width:28px;height:28px;border:none;border-radius:8px;background:rgba(196,167,107,.16);color:var(--primary);font-weight:800;
    }
    .cart-item .price{
      color:var(--primary);font-weight:800;font-size:1rem;
    }
    .drawer-footer{
      padding:18px;background:rgba(255,255,255,.7);border-top:1px solid rgba(196,167,107,.26);
    }
    .summary{
      display:flex;justify-content:space-between;align-items:center;
      margin-bottom:14px;color:var(--primary);font-weight:800;
    }
    .total-amount{font-size:1.55rem}
    .checkout-btn{
      width:100%;border:none;border-radius:12px;padding:15px 18px;background:var(--primary);color:var(--ivory);font-weight:800;
    }

    /* order modal */
    .order-modal{
      position:fixed;inset:0;background:rgba(0,0,0,.36);display:none;place-items:center;z-index:80;
    }
    .order-modal.open{display:grid}
    .order-card{
      width:min(720px,calc(100% - 24px));
      background:rgba(251,247,238,.98);
      border:1px solid rgba(196,167,107,.32);
      border-radius:22px;
      padding:20px;
      box-shadow:var(--shadow-strong);
    }
    .order-head{
      display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;
    }
    .order-head h3{
      margin:0;
      font-family:var(--font-heading);
      font-size:2.2rem;color:var(--primary);
    }
    .order-form-grid{

        const v = source[key];
        if (v && typeof v === 'object' && !Array.isArray(v)) {
          out[key] = mergeDeep(out[key] || {}, v);
        } else {

        if(size > 4_500_000){
          console.warn("اقتراب من حد localStorage");
        }
      }catch{}
    }

    function debounceSave(){
      clearTimeout(window._deb);
      window._deb = setTimeout(saveState, 300);
    }

    function getCartItems(){
      return appState.cart.map(item => {
        const product = appState.products.find(p => p.id === item.id);
        return product ? { ...item, product } : null;
      }).filter(Boolean);
    }

    function getCartTotal(){
      return getCartItems().reduce((sum, item) => sum + (item.product.price * item.quantity), 0);
    }

    function renderCart(){
      const container = document.getElementById("cartItems");
      const items = getCartItems();
      if(!container) return;
      if(!items.length){
        container.innerHTML = '<div class="warning-box">السلة فارغة الآن.</div>';
      }else{
        container.innerHTML = items.map(item => `
          <div class="cart-item">
            <img src="${item.product.image}" alt="${item.product.name}" />
            <div>
              <h4>${item.product.name}</h4>
              <small>${item.product.category}</small>
              <div class="qty-row">
                <span class="price">${formatPrice(item.product.price * item.quantity)}</span>
                <div class="qty-controls">
                  <button data-action="minus" data-id="${item.product.id}">−</button>
                  <span>${item.quantity}</span>
                  <button data-action="plus" data-id="${item.product.id}">+</button>
                </div>
              </div>
            </div>
          </div>
        `).join("");
      }
      const total = document.getElementById("totalCart");
      if(total) total.textContent = formatPrice(getCartTotal());

      document.querySelectorAll("[data-action='plus']").forEach(btn => {
        btn.onclick = () => changeQty(Number(btn.dataset.id), 1);
      });
      document.querySelectorAll("[data-action='minus']").forEach(btn => {
        btn.onclick = () => changeQty(Number(btn.dataset.id), -1);
      });
    }

    function addToCart(productId){
      const existing = appState.cart.find(item => item.id === productId);
      if(existing) existing.quantity += 1;
      else appState.cart.push({id:productId, quantity:1});
      renderCart();
      debounceSave();
    }

    function changeQty(productId, delta){
      const item = appState.cart.find(i => i.id === productId);
      if(!item) return;
      item.quantity += delta;
      if(item.quantity <= 0){
        appState.cart = appState.cart.filter(i => i.id !== productId);
      }
      renderCart();
      debounceSave();
    }

    function getFilteredProducts(){
      const search = (appState.filters.search || "").trim().toLowerCase();
      let items = [...appState.products];
      if (appState.filters.selectedCategory && appState.filters.selectedCategory !== "الكل") {
        items = items.filter(p => p.category === appState.filters.selectedCategory);
      }
      if (search) {
        items = items.filter(p => (
          p.name.toLowerCase().includes(search) ||
          p.category.toLowerCase().includes(search) ||
          p.description.toLowerCase().includes(search)
        ));
      }
      if (appState.filters.sort === "السعر الأعلى") {
        items.sort((a,b) => b.price - a.price);
      } else if (appState.filters.sort === "السعر الأقل") {
        items.sort((a,b) => a.price - b.price);
      } else if (appState.filters.sort === "الأحدث") {
        items.sort((a,b) => b.id - a.id);
      } else {
        items.sort((a,b) => a.name.localeCompare(b.name, "ar"));
      }
      return items;
    }

    function compressImage(file){
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement("canvas");
            const maxW = 1200;
            const ratio = Math.min(maxW / img.width, 1);
            canvas.width = img.width * ratio;
            canvas.height = img.height * ratio;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL("image/jpeg", 0.75));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function compressVideo(file){
      return new Promise((resolve) => {
        resolve(URL.createObjectURL(file));
      });
    }

    function authenticateAdmin(password){
      return sha256(password) === ADMIN_PASSWORD_HASH;
    }

    function sha256(str){
      const encoder = new TextEncoder();
      const data = encoder.encode(str);
      return crypto.subtle.digest("SHA-256", data).then(buf => Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join(""));
    }

    function openPasswordGate(){
      const password = prompt("أدخل كلمة المرور للدخول إلى لوحة التحكم:");
      if(!password) return false;
      sha256(password).then(hash => {
        if(hash === ADMIN_PASSWORD_HASH){
          localStorage.setItem("asala-admin-session", String(Date.now() + (24 * 60 * 60 * 1000)));
          openAdmin();
        } else {
          alert("كلمة المرور غير صحيحة.");
        }
      });
    }

        <video class="intro-video" autoplay muted loop playsinline>
          <source src="https://videos.pexels.com/video-files/3195394/3195394-hd_1920_1080_25fps.mp4" type="video/mp4" />
        </video>
        <div class="intro-content">
          <div class="intro-logo">${appState.settings.shopName}</div>
        </div>
        <button class="intro-skip" id="skipIntroBtn">تخطي</button>
      `;
      document.body.appendChild(intro);

      setTimeout(() => {
        intro.classList.add("hidden");
      }, 5000);

      document.getElementById("skipIntroBtn").addEventListener("click", () => {
        intro.classList.add("hidden");
      });
    });
  </script>
</body>
</html>
